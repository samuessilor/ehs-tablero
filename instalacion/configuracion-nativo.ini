; =============================================================================
; configuracion-nativo.ini - instalacion desatendida de SQL Server 2022 Express
; -----------------------------------------------------------------------------
; instalar.ps1 -Motor nativo pasa este archivo a setup.exe con
; /ConfigurationFile. Solo lleva CONSTANTES y solo caracteres ASCII: lo que
; depende del equipo va por linea de comandos, que es Unicode:
;   /SAPWD               la clave de sa, generada en memoria, nunca en disco
;   /SQLSYSADMINACCOUNTS el grupo local de Administradores, por su SID
;   /INSTALLSQLDATADIR   la carpeta ehs-datos\motor del paquete
; Una version anterior sustituia esos valores DENTRO de este archivo y lo
; guardaba en ASCII: una ene o una tilde en la ruta o en el usuario se volvia '?'.
;
; Collation fijada a SQL_Latin1_General_CP1_CI_AS: la misma de la imagen de
; contenedor con la que se verifico el esquema. Sin fijarla, el medio en
; espanol (SQLEXPR_x64_ESN) instalaria Modern_Spanish_CI_AS por defecto.
;
; SOLO el motor (FEATURES=SQLENGINE): el esquema no usa Agent, Reporting,
; Analysis ni nada de Enterprise (auditoria de Fase A).
; =============================================================================

[OPTIONS]
ACTION="Install"
QUIET="True"
QUIETSIMPLE="False"
UpdateEnabled="False"
FEATURES=SQLENGINE
INSTANCENAME="EHSLOCAL"
INSTANCEID="EHSLOCAL"

; La cuenta virtual que SQL Server crea sola por instancia: no es una cuenta de
; dominio ni pide contrasena.
SQLSVCACCOUNT="NT SERVICE\MSSQL$EHSLOCAL"
SQLSVCSTARTUPTYPE="Automatic"

; Autenticacion mixta: hacen falta los logins SQL ehs_migrador y ehs_app.
SECURITYMODE="SQL"

SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

; TCP encendido, pero setup.exe no sabe restringirlo a 127.0.0.1: eso lo hace
; instalar.ps1 despues (ListenOnAllIPs=0 y solo la IP de loopback habilitada) y
; lo comprueba con Get-NetTCPConnection antes de seguir.
TCPENABLED="1"
NPENABLED="0"

; SQL Server Browser escucha UDP 1434 en todas las interfaces. Con puerto fijo
; no hace falta: deshabilitado.
BROWSERSVCSTARTUPTYPE="Disabled"
