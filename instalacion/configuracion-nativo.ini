; =============================================================================
; configuracion-nativo.ini — instalacion desatendida de SQL Server 2022 Express
; -----------------------------------------------------------------------------
; instalar.ps1 -Motor nativo pasa este archivo a setup.exe con
; /ConfigurationFile=configuracion-nativo.ini. La contrasena de sa NO va aqui —
; setup.exe la exige por separado con /SAPWD, y ese archivo nunca queda escrito
; en disco (instalar.ps1 la genera en memoria y la pasa solo como argumento).
;
; Collation fijada a SQL_Latin1_General_CP1_CI_AS a proposito: es la misma que
; trae por defecto la imagen de contenedor con la que se verifico el esquema
; esta sesion (mcr.microsoft.com/mssql/server:2022-latest), y nunca se habia
; fijado de forma explicita en ningun lado — hallazgo de la auditoria de Fase A.
; Fijarla aqui es lo que hace que el modo nativo y el modo contenedor terminen
; en la MISMA collation sin depender de cual sea el default de cada maquina.
;
; SOLO instala el motor de base de datos (FEATURES=SQLENGINE). Nada de Reporting
; Services, Analysis Services, ni las herramientas de administracion: coincide
; con el hallazgo de Fase A de que el esquema no usa SQL Agent, Resource
; Governor ni ninguna caracteristica de Enterprise.
; =============================================================================

[OPTIONS]
ACTION="Install"
QUIET="True"
QUIETSIMPLE="False"
UpdateEnabled="False"
FEATURES=SQLENGINE
INSTANCENAME="EHSLOCAL"
INSTANCEID="EHSLOCAL"

; Cuenta del servicio: la cuenta virtual que SQL Server crea sola por instancia.
; No es una cuenta de dominio ni pide contrasena — exactamente lo que
; requisitos-it.md promete no pedir.
SQLSVCACCOUNT="NT SERVICE\MSSQL$EHSLOCAL"
SQLSVCSTARTUPTYPE="Automatic"

; Autenticacion mixta: hacen falta los dos logins SQL (ehs_migrador, ehs_app) de
; instalacion/crear-logins.sql, no solo autenticacion de Windows.
SECURITYMODE="SQL"

; Quien administra la instancia al instalar. instalar.ps1 sustituye
; __CUENTA_ADMINISTRADORA__ por el usuario de Windows que esta corriendo el
; instalador antes de pasar este archivo a setup.exe.
SQLSYSADMINACCOUNTS="__CUENTA_ADMINISTRADORA__"

SQLCOLLATION="SQL_Latin1_General_CP1_CI_AS"

; TCP encendido de entrada, pero setup.exe no tiene una opcion para restringirlo
; a 127.0.0.1: eso lo hace instalar.ps1 DESPUES de instalar, editando las
; propiedades del protocolo TCP via WMI (Configuration Manager es una GUI, no
; algo que setup.exe sepa configurar por si solo) y reiniciando el servicio.
; Sin ese paso posterior, TCPENABLED=1 dejaria la instancia escuchando en TODAS
; las interfaces, que es exactamente lo que este proyecto necesita evitar.
TCPENABLED="1"
NPENABLED="0"

; Sin instancia por defecto, sin heredar nada de una instalacion previa de SQL
; Server que pudiera existir en el equipo del area.
INSTALLSQLDATADIR="__CARPETA_DATOS__"
